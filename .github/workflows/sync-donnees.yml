name: Synchronisation des données

# Récupère les dernières données nettoyées du dépôt assuria-donnees
# (sinistres -> data/objectif3-sinistres/, offres -> data/objectif1-offres/, prix simulés -> data/objectif1-simulation/), commit seulement si elles ont changé.
on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures
  workflow_dispatch:        # lancement manuel possible

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le dépôt de données
        uses: actions/checkout@v4
        with:
          repository: adam-hassen/assuria-donnees
          path: _source

      - name: Copier les données nettoyées
        run: |
          mkdir -p data/objectif3-sinistres
          for f in sinistres_europe.parquet sinistres_bruts.parquet rapport_nettoyage.json README.md; do
            cp "_source/data/clean/$f" data/objectif3-sinistres/
          done
          mkdir -p data/objectif1-offres
          if [ -d _source/data/clean/offres ]; then
            cp _source/data/clean/offres/* data/objectif1-offres/
          fi
          mkdir -p data/objectif1-simulation
          if [ -d _source/data/clean/simulation ]; then
            cp _source/data/clean/simulation/* data/objectif1-simulation/
          fi
          rm -rf _source

      - name: Enregistrer si changement
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "Aucune nouveauté"
          else
            git config user.name "pipeline-donnees"
            git config user.email "pipeline-donnees@users.noreply.github.com"
            git commit -m "Données : mise à jour automatique $(date -u +%F)"
            git push
          fi
