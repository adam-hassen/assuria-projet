name: Synchronisation des données

# Récupère les données du dépôt assuria-donnees et les range par objectif dans data/ (script scripts/sync.sh).
# Commit seulement si quelque chose a changé.
on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures
  workflow_dispatch:        # lancement manuel possible

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le dépôt de données
        uses: actions/checkout@v4
        with:
          repository: adam-hassen/assuria-donnees
          path: _source

      - name: Copier les données, rangées par objectif
        run: |
          bash scripts/sync.sh _source
          rm -rf _source

      - name: Enregistrer si changement
        run: |
          git add -A data/
          if git diff --cached --quiet; then
            echo "Aucune nouveauté"
          else
            git config user.name "pipeline-donnees"
            git config user.email "pipeline-donnees@users.noreply.github.com"
            git commit -m "Données : mise à jour automatique $(date -u +%F)"
            git push
          fi
